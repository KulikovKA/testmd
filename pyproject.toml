[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-agent-runtime"
version = "0.1.0"
description = "Universal Agent Runtime R&D proof-of-concept scaffold."
requires-python = ">=3.11"
dependencies = [
    "docker==7.2.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.20.2",
    "pytest==8.4.2",
    "ruff==0.16.6",
    "types-docker==7.2.0.20260827",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
